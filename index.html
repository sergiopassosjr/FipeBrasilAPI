<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Consulta FIPE</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 p-8 font-sans">
    <div class="max-w-3xl mx-auto bg-white p-6 rounded-lg shadow-md">
        <h1 class="text-2xl font-bold mb-6 text-center text-blue-600">Consulta Tabela FIPE</h1>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
            <div class="flex flex-col min-w-0">
                <label for="tipoVeiculo" class="mb-1 font-semibold">Tipo:</label>
                <div class="flex gap-2">
                    <select id="tipoVeiculo" class="flex-1 min-w-0 truncate border border-gray-300 rounded p-2 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="carros">Carros</option>
                        <option value="motos">Motos</option>
                        <option value="caminhoes">Caminhões</option>
                    </select>
                    <button id="btnBuscarMarcas" onclick="buscarMarcas()" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded transition-colors flex-shrink-0 disabled:opacity-50 disabled:cursor-not-allowed">Buscar</button>
                </div>
            </div>

            <div class="flex flex-col min-w-0">
                <label for="marcaVeiculo" class="mb-1 font-semibold">Marca:</label>
                <div class="flex gap-2">
                    <select id="marcaVeiculo" class="flex-1 min-w-0 truncate border border-gray-300 rounded p-2 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500"></select>
                    <button id="btnBuscarModelos" onclick="buscarModelos()" disabled class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded transition-colors flex-shrink-0 disabled:opacity-50 disabled:cursor-not-allowed">Buscar</button>
                </div>
            </div>

            <div class="flex flex-col min-w-0">
                <label for="modeloVeiculo" class="mb-1 font-semibold">Modelo:</label>
                <div class="flex gap-2">
                    <select id="modeloVeiculo" class="flex-1 min-w-0 truncate border border-gray-300 rounded p-2 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500"></select>
                    <button id="btnBuscarAnos" onclick="buscarAnos()" disabled class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded transition-colors flex-shrink-0 disabled:opacity-50 disabled:cursor-not-allowed">Buscar</button>
                </div>
            </div>

            <div class="flex flex-col min-w-0">
                <label for="anoVeiculo" class="mb-1 font-semibold">Ano:</label>
                <div class="flex gap-2">
                    <select id="anoVeiculo" class="flex-1 min-w-0 truncate border border-gray-300 rounded p-2 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500"></select>
                    <button id="btnConsultar" onclick="consultarPrecoFipe()" disabled class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded transition-colors font-bold flex-shrink-0 disabled:opacity-50 disabled:cursor-not-allowed">Consultar</button>
                </div>
            </div>
        </div>

        <div id="status" class="text-center font-semibold text-gray-600 mb-4 h-6"></div>
        
        <div class="overflow-x-auto">
            <table class="min-w-full bg-white border border-gray-200 shadow-sm rounded">
                <thead class="bg-gray-100 text-gray-700">
                    <tr>
                        <th class="py-3 px-4 border-b text-left font-semibold">Marca</th>
                        <th class="py-3 px-4 border-b text-left font-semibold">Modelo</th>
                        <th class="py-3 px-4 border-b text-left font-semibold">Ano</th>
                        <th class="py-3 px-4 border-b text-left font-semibold text-green-700">Preço</th>
                    </tr>
                </thead>
                <tbody id="resultadoFipe" class="divide-y divide-gray-200">
                </tbody>
            </table>
        </div>
    </div>

    <script src="fipeApi.js"></script>
</body>
</html>
